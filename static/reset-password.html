<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワードの再設定 | Photelier サロン</title>
<link rel="stylesheet" href="/static/design-tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--cream); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { width: 100%; max-width: 440px; background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 40px 34px; text-align: center; }
  .logo { font-family: var(--script); font-size: 30px; color: var(--blue-deep); margin-bottom: 6px; }
  .sub { font-size: 11px; letter-spacing: .28em; color: var(--text-soft); text-transform: uppercase; }
  h1 { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: .04em;
    margin: 26px 0 10px; line-height: 1.6; }
  .lead { font-size: 13.5px; line-height: 1.9; color: var(--text-soft); margin-bottom: 26px; }
  .field { text-align: left; margin-bottom: 18px; }
  label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 11.5px; color: var(--text-soft); font-weight: 400; margin-left: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--sans); font-size: 15px; color: var(--text); background: #fff; outline: none; }
  input:focus { border-color: var(--blue); }
  button { width: 100%; padding: 14px; background: var(--blue); color: #fff; border: none;
    border-radius: 8px; font-family: var(--sans); font-size: 15px; letter-spacing: .06em;
    cursor: pointer; margin-top: 6px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 13px; line-height: 1.8; margin-top: 18px; }
  .msg.error { color: #B4553F; }
  .state { font-size: 13.5px; line-height: 1.9; color: var(--text-soft); }
  a { color: var(--blue-deep); }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Photelier&nbsp;Academy</div>
    <div class="sub">Salon</div>

    <!-- 新しいパスワードを決める -->
    <div id="form-area" style="display:none;">
      <h1>新しいパスワードを<br>決めてください</h1>
      <p class="lead">次回からは、このパスワードでお入りいただけます。</p>
      <div class="field">
        <label>新しいパスワード<span class="hint">8文字以上</span></label>
        <input type="password" id="password" placeholder="半角英数字で8文字以上"
          autocomplete="new-password">
      </div>
      <div class="field">
        <label>もう一度<span class="hint">確認のため</span></label>
        <input type="password" id="password2" placeholder="同じものをもう一度"
          autocomplete="new-password">
      </div>
      <button id="submit" onclick="save()">この内容で変更する</button>
      <div id="msg" class="msg"></div>
    </div>

    <!-- 変更できた -->
    <div id="done-area" style="display:none;">
      <h1>変更できました</h1>
      <p class="state">新しいパスワードでお入りいただけます。</p>
      <button style="margin-top:22px;" onclick="location.href='/'">ログイン画面へ →</button>
    </div>

    <!-- リンクが古い等 -->
    <div id="error-area" style="display:none;">
      <h1>このリンクは使えませんでした</h1>
      <p class="state" id="error-text"></p>
      <p class="state" style="margin-top:14px;">
        ログイン画面の「パスワードを忘れた方」から、もう一度お送りできます。
      </p>
      <button style="margin-top:22px;" onclick="location.href='/'">ログイン画面へ →</button>
    </div>
  </div>

<script>
// メールのリンクには、合言葉が「#」のうしろに付いてくる。
// 例: /reset-password#access_token=xxxx&type=recovery
// 「#」より後ろはサーバーには届かないので、ここ（ブラウザ）で取り出す。
const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
const accessToken = hash.get('access_token');

function show(id) {
  ['form-area', 'done-area', 'error-area'].forEach(x => {
    document.getElementById(x).style.display = x === id ? 'block' : 'none';
  });
}

function boot() {
  if (!accessToken) {
    // リンクが古いとき、Supabase は error_description を付けて返してくる
    const reason = hash.get('error_description')
      || new URLSearchParams(location.search).get('error_description');
    document.getElementById('error-text').textContent =
      reason ? decodeURIComponent(reason.replace(/\+/g, ' '))
             : 'リンクの有効期限が切れているようです。';
    show('error-area');
    return;
  }
  // 合言葉をアドレス欄から消しておく（履歴や共有から漏れないように）
  history.replaceState(null, '', location.pathname);
  show('form-area');
  document.getElementById('password').focus();
}

async function save() {
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submit');
  msg.className = 'msg';
  msg.textContent = '';
  if (password.length < 8) {
    msg.className = 'msg error';
    msg.textContent = 'パスワードは8文字以上にしてください';
    return;
  }
  if (password !== password2) {
    msg.className = 'msg error';
    msg.textContent = '2つのパスワードが違うようです';
    return;
  }

  btn.disabled = true;
  msg.textContent = '変更しています…';
  try {
    const res = await fetch('/api/password-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ access_token: accessToken, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('error-text').textContent = data.detail || '変更できませんでした。';
      show('error-area');
      return;
    }
    // 前のログイン状態は捨てて、新しいパスワードで入り直してもらう
    localStorage.removeItem('photelier_token');
    show('done-area');
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = '通信に失敗しました。もう一度お試しください。';
    btn.disabled = false;
  }
}

document.getElementById('password2').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
boot();
</script>
</body>
</html>
